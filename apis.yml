aid: goji
name: Goji
description: >-
  Goji is a private-fund digitisation platform, part of the Euroclear group and
  regulated by the UK Financial Conduct Authority. Founded in 2015 and backed by
  Anthemis, Goji provides end-to-end infrastructure for asset managers, fund
  administrators and distributors to digitise access to private markets --
  investor onboarding, KYC/KYB and AML, ISA administration, payments, and debt
  and equity settlement. Its Platform API exposes investor, payment, settlement,
  bond and ISA operations over HTTPS with HMAC-signed requests and a webhook
  event stream, letting distributors offer investors a fully digital investment
  journey into private market funds.

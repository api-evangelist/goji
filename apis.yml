apis:
- aid: goji:goji-platform-api
  name: Goji Platform API
  description: >-
    The Goji Platform API for private-markets investing: create and KYC/KYB
    investors, open and administer IF ISAs, move funds via investor and manager
    payment APIs, settle debt and equity investments, manage bond products, and
    subscribe to platform webhook events. Requests are cryptographically signed
    with HMAC-SHA256 in production; a Basic-auth sandbox is available for
    prototyping.
